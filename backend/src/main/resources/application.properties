spring.application.name=backend
server.port=${PORT:8080}

# Neon PostgreSQL, database name: ContentService
# DB_URL example: jdbc:postgresql://<neon-host>/ContentService?sslmode=require
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

#spring.ai.vectorstore.pgvector.initialize-scheme=true
#spring.ai.openai.api-key=${OPENAI_API_KEY}

spring.ai.google.genai.api-key=${API_KEY}
spring.ai.google.genai.chat.options.model=gemini-2.5-flash
spring.genai.embedding.options.model=text-embedding-004
spring.ai.vectorstore.pgvector.initialize-schema=true

#spring.servlet.multipart.max-file-size=5MB
#spring.servlet.multipart.max-request-size=6MB

content.upload-dir=uploads
